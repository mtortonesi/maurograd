name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every supported Ruby (gemspec: >= 3.2) on Linux, the latest on macOS.
          - { os: ubuntu-latest, ruby: "3.2" }
          - { os: ubuntu-latest, ruby: "3.3" }
          - { os: ubuntu-latest, ruby: "3.4" }
          - { os: ubuntu-latest, ruby: "4.0", lint: true }
          - { os: macos-latest, ruby: "4.0" }
    runs-on: ${{ matrix.os }}
    env:
      # Skip bench-only (torch-rb) and examples-only (chunky_png, erv, csv)
      # dependencies - the library and test suite don't need them. (sus
      # itself lives in the implicit :development group Bundler creates for
      # gemspec-declared development dependencies, so :development can't be
      # excluded here without also losing sus.)
      BUNDLE_WITHOUT: bench:examples

    steps:
      - uses: actions/checkout@v4

      # macOS needs nothing extra: the extension links Apple's Accelerate.
      - name: Install OpenBLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Lint
        if: matrix.lint
        run: bundle exec bake lint

      - name: Build extension and run test suite
        run: bundle exec bake ci

  # Builds the gems, installs them outside the checkout and trains a few
  # steps with the installed copy: catches files missing from the gemspec,
  # extensions that don't build from the packaged sources, and requires that
  # only work inside the repo.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE_WITHOUT: bench:examples

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Build the gems
        run: bundle exec bake package

      - name: Install maurograd and run the smoke test outside the checkout
        run: |
          # Reuse the Numo gems Bundler already installed (numo-linalg-alt
          # takes minutes to build), but install maurograd into a fresh
          # directory so the test sees only the packaged files.
          deps="$(bundle exec ruby -e 'print Gem.loaded_specs["numo-narray-alt"].base_dir')"
          export GEM_HOME="$RUNNER_TEMP/gems" GEM_PATH="$RUNNER_TEMP/gems:$deps"
          gem install --local --no-document pkg/maurograd-[0-9]*.gem
          cd "$RUNNER_TEMP" && ruby "$GITHUB_WORKSPACE/script/smoke_installed_gem.rb" cpu

  # The same for maurograd-mlx, which needs mlx-c from Homebrew. Non-blocking
  # for now: GitHub's macOS runners are virtual machines, and whether MLX
  # works there (on the paravirtualized GPU, or falling back to its CPU
  # device) is unverified. Drop continue-on-error once it has passed reliably.
  package-mlx:
    runs-on: macos-latest
    continue-on-error: true
    env:
      BUNDLE_WITHOUT: bench:examples

    steps:
      - uses: actions/checkout@v4

      - name: Install mlx-c
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install mlx-c

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Build the gems
        run: bundle exec bake package

      - name: Install both gems and run the smoke test on MLX
        run: |
          deps="$(bundle exec ruby -e 'print Gem.loaded_specs["numo-narray-alt"].base_dir')"
          export GEM_HOME="$RUNNER_TEMP/gems" GEM_PATH="$RUNNER_TEMP/gems:$deps"
          gem install --local --no-document pkg/maurograd-[0-9]*.gem pkg/maurograd-mlx-*.gem
          cd "$RUNNER_TEMP" && ruby "$GITHUB_WORKSPACE/script/smoke_installed_gem.rb" mlx
